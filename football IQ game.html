<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>The Football IQ Game</title>
	<style>
		*{
			box-sizing: border-box;
		}
		body {
			margin: 0;
			background: #fff;
			color: #161616;
			font-family: system-ui, sans-serif;
		}
		main {
			max-width: 64rem;
			margin: 0 auto;
			padding: clamp(4rem, 16vh 10rem) 1.25rem 3rem;
			text-align:center;
		}
		h1 {
			margin: 0 0 clamp(2.5rem, 8vh, 5rem);
			font-size: clamp(2.5rem, 7.5vw, 5.5rem);
			line-height: 1.05;
			letter-spacing: -0.055em;
		}
		.games {
			display:grid;
			gap; 1rem;
			width:min(100%, 22rem);
			margin-inline: auto;
		}
		button {
			min-height: 4.5rem;
			padding: 0.75rem 1rem;
			border: 2px solid currentColor;
			border-radius: 0.65rem;
			background: #fff;
			color: inherit;
			font: 700 1.45rem system-ui, sans-serif;
			cursor: pointer;
		}
		button:hover {
			background: #f5f5f5;
		}
		#status {
			min-height: 1.5rem;
		}
	</style>
</head>
<body>
	<main>
	<h1>The Football IQ Game</h1>
	
	<div class="game" role="group" aria-lable="Game modes">
		<button type="button">Quiz</button><br>
		<button type="button">guess</button><br>
		<button type="button">X/O</button>
	</div>
	<p id="status" role="status"></p>
	</main>
	<script>
		const message = document.querySelector('#status');
		
		for (const button of document.querySelectorAll('.games button')) {
			button.addEventlistener('click', () => {
				message.textContent = button.textContent + ' is coming soon.';
			});
		}
	</script>
</body>
</html>
